    @font-face {
      font-family: 'Google Sans';

      font-style: normal;
    }

    @font-face {
      font-family: 'Google Sans';
      src: url('assets/fonts/%20GoogleSans-Medium.ttf') format('truetype');
      font-weight: 500;
      font-style: normal;
    }

    @font-face {
      font-family: 'Google Sans';
      src: url('assets/fonts/%20GoogleSans-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
    }

    :root {
      --bg-color: #F0F0F0;
      --devfest-green: #34A853;
      --accent-yellow: #FBBC04;
      --text-primary: #1E1E1E;
      --text-secondary: #808793;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: var(--bg-color);
      font-family: 'Google Sans', sans-serif;
      color: var(--text-primary);
    }

    /* Core Clip Layouts */
    .clip {
      position: absolute;
      visibility: hidden; /* Managed by HyperFrames runtime */
      width: 1920px;
      height: 1080px;
      left: 0;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* SVG Layout Wrapper */
    .svg-container {
      position: relative;
      width: 1920px;
      height: 1080px;
    }

    /* Unified Text Group: title + speaker-info in a grid layout.
       speaker-info is pinned to the bottom (aligned with video frame at 951px),
       title-box floats vertically centered in the remaining space above. */
    .text-group {
      position: absolute;
      left: 846px;
      top: 436px;
      width: 945px;
      height: 515px;
      /* bottom aligns with video frame bottom: 130 + 821 = 951px */
      display: grid;
      grid-template-rows: 1fr auto;
      row-gap: 28px;
      z-index: 20;
      pointer-events: none;
      font-family: 'Google Sans', sans-serif;
      overflow: hidden;
    }

    /* Premium Adaptive HTML Title Box — centered in the 1fr grid row */
    .title-box {
      align-self: center;
      font-weight: 700;
      color: #1e1e1e;
      letter-spacing: -0.02em;
      line-height: 1.2;
      white-space: pre-wrap;
      word-break: normal;
      overflow-wrap: normal;
    }

    /* Speaker info block — pinned to the bottom of the grid (auto row) */
    .speaker-info {}

    .speaker-name {
      font-size: 52px;
      font-weight: 400;
      color: #1E1E1E;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .speaker-company {
      font-size: 52px;
      font-weight: 400;
      color: #808793;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Thin blinking cursor that trails the typewriter in HTML */
    .cursor-span {
      font-weight: 100;
      display: inline;
      padding-left: 2px;
      line-height: 1;
    }

    /* Waves: initial state for draw-in animation (full 4 arches = ~561px) */
    .wave-path {
      stroke-dasharray: 600;
      stroke-dashoffset: 600;
    }

    /* 3 Yellow Dots: SVG transform box configuration */
    #dot_1, #dot_2, #dot_3 {
      transform-box: fill-box;
      transform-origin: center;
    }
  </style>
</head>

    /************************************************************************
     * GSAP TIMELINE DEFINITION & DYNAMIC TEMPLATE SCRIPT
     ************************************************************************/
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // 1. Video card, static image fallback, and border fade in cleanly
    tl.fromTo(["#card-video", "#card-image", "#video_border"],
      { opacity: 0 },
      { opacity: 1, duration: 2.0, ease: "power2.out" },
      0.3
    );

    // 2. Header Brand Cluster: Brackets, DevFest logo & Kraków pill fade in

      { opacity: 0, y: -15 },
      { opacity: 1, y: 0, duration: 1.2, ease: "power2.out", stagger: 0.1 },
      0.2
    );
    tl.fromTo(["#devfest_logo", "#krakow_pill", "#krakow_text"],
      { opacity: 0, y: -15 },
      { opacity: 1, y: 0, duration: 1.4, ease: "power3.out" },
      0.4
    );

    // 3. Code Symbols (# and { }) fade in
    tl.fromTo(["#code_hash", "#code_braces"],
      { opacity: 0, scale: 0.9 },
      { opacity: 1, scale: 1, duration: 1.5, ease: "power2.out", stagger: 0.2, svgOrigin: "1600 215" },
      0.6
    );

    // 4. Decorative Row: Waves draw in dynamically across all 4 arches
    tl.to(".wave-path", {
      strokeDashoffset: 0,
      duration: 1.8,
      ease: "power2.inOut",
      stagger: 0.25
    }, 0.8);

    // 5. 3 Yellow Dots grow out of nothing in-place at T = 1.0s
    tl.fromTo(["#dot_1", "#dot_2", "#dot_3"],
      { attr: { r: 0 }, opacity: 0 },
      { attr: { r: 21.6 }, opacity: 1, duration: 0.6, ease: "back.out(1.7)", stagger: 0.15 },
      1.0
    );

    // 6. 3 Yellow Dots: jump one by one strictly sequentially at T = 4.0s:
    // Dot 1 hops up and lands -> then Dot 2 hops up and lands -> then Dot 3 hops up and lands.
    const dotsJump = gsap.timeline();
    dotsJump
      .to("#dot_g_1", { y: -15, duration: 0.22, ease: "power1.out", yoyo: true, repeat: 1 })
      .to("#dot_g_2", { y: -15, duration: 0.22, ease: "power1.out", yoyo: true, repeat: 1 }, "+=0.06")
      .to("#dot_g_3", { y: -15, duration: 0.22, ease: "power1.out", yoyo: true, repeat: 1 }, "+=0.06");
    tl.add(dotsJump, 4.0);

    // 7. Title container fades in cleanly in-place as it begins typing
    tl.fromTo("#title-box",
      { opacity: 0 },
      { opacity: 1, duration: 2.0, ease: "power3.out" },
      1.0
    );

    // 7. Speaker Name slides up and fades in
    tl.fromTo("#name",
      { y: 60, opacity: 0 },
      { y: 0, opacity: 1, duration: 2.0, ease: "power3.out" },
      1.8
    );

    // 8. Speaker Position/Company slides up and fades in staggered
    tl.fromTo("#position_company",
      { y: 60, opacity: 0 },
      { y: 0, opacity: 1, duration: 2.0, ease: "power3.out" },
      2.2
    );

    // ========================================================================
    // ✍️ CARD CONFIGURATION
    // ========================================================================
    const CARD_CONFIG = {
      title: "Keeping it Cool: Avoiding Crisis-based Leadership (and work)",
      name: "Adi Mazor Kario, Developer Cloud",
      position_company: "Company Google Foundation",
      year: "2026"
    };

    // Adaptive speaker info sizing function
    function applyAdaptiveSpeakerInfoSize(name, positionCompany) {
      const nameEl = document.getElementById("name");
      const companyEl = document.getElementById("position_company");
      const maxWidth = 945;

      nameEl.textContent = name;
      companyEl.textContent = positionCompany;

      nameEl.style.whiteSpace = "nowrap";
      companyEl.style.whiteSpace = "nowrap";

      let fontSize = 52;
      const minFontSize = 24;

      while (fontSize > minFontSize) {
        nameEl.style.fontSize = fontSize + "px";
        companyEl.style.fontSize = fontSize + "px";

        if (nameEl.scrollWidth <= maxWidth && companyEl.scrollWidth <= maxWidth) {
          break;
        }
        fontSize -= 1;
      }

      nameEl.style.fontSize = fontSize + "px";
      companyEl.style.fontSize = fontSize + "px";
    }

    function normalizeCardTitle(rawTitle) {
      return String(rawTitle || "")
        .replace(/&nbsp;|&#160;|&#xA0;/gi, "\u00A0")
        .replace(/\[\[([\s\S]+?)\]\]/g, (_, inner) => inner.replace(/[ \t]+/g, "\u00A0"));
    }

    // Adaptive text sizing function
    function applyAdaptiveTextSize(title) {
      const normalizedTitle = normalizeCardTitle(title);
      CARD_CONFIG.title = normalizedTitle;
      const titleBox = document.getElementById("title-box");
      const maxWidth = 945;
      const maxHeight = 340;

      const titleTextEl = titleBox.querySelector("#title-text");
      const cursorEl = titleBox.querySelector("#cursor");
      titleBox.style.wordBreak = "normal";
      titleBox.style.overflowWrap = "normal";
      titleTextEl.textContent = normalizedTitle;

      const hasExplicitNewlines = normalizedTitle.includes("\n");
      const hasOnlyNonBreakingSpaces = !normalizedTitle.includes(" ") && !hasExplicitNewlines;
      const singleLineMinFontSize = hasOnlyNonBreakingSpaces ? 28 : 64;
      let fontSize = 110;
      let fitsOnSingleLine = false;

      if (!hasExplicitNewlines) {
        while (fontSize >= singleLineMinFontSize) {
          titleBox.style.fontSize = fontSize + "px";
          titleBox.style.whiteSpace = "nowrap";
          const contentWidth = titleTextEl.getBoundingClientRect().width + (cursorEl ? cursorEl.getBoundingClientRect().width : 0);
          const overflowWidth = titleBox.scrollWidth;
          titleBox.style.whiteSpace = "";

          if (overflowWidth <= maxWidth && contentWidth <= maxWidth - 4) {
            fitsOnSingleLine = true;
            break;
          }
          fontSize -= 2;
        }
      }

      if (!fitsOnSingleLine) {
        fontSize = hasExplicitNewlines ? 110 : 84;
        const minFontSize = 28;
        while (fontSize > minFontSize) {
          titleBox.style.fontSize = fontSize + "px";
          if (titleBox.scrollHeight <= maxHeight && titleBox.scrollWidth <= maxWidth) {
            break;
          }
          fontSize -= 2;
        }
        if (titleBox.scrollWidth > maxWidth) {
          titleBox.style.overflowWrap = "break-word";
        }
      }

      titleBox.style.fontSize = fontSize + "px";

      if (!fitsOnSingleLine && !hasExplicitNewlines && normalizedTitle.trim().split(/[ \t\r\n]+/).length > 2) {
        const minOrphanFontSize = Math.max(fontSize - 20, 44);
        let orphanFixed = false;

        while (fontSize > minOrphanFontSize) {
          titleBox.style.fontSize = fontSize + "px";

          const lineHeight = parseFloat(getComputedStyle(titleBox).lineHeight) || (fontSize * 1.2);
          const totalTextHeight = titleBox.scrollHeight;
          const lineCount = Math.round(totalTextHeight / lineHeight);

          if (lineCount <= 1) break;

          const textSpan = titleBox.querySelector("#title-text");
          const originalText = textSpan.textContent;

          const range = document.createRange();
          const textNode = textSpan.firstChild;

          let lastLineWords = 0;
          if (textNode && textNode.nodeType === Node.TEXT_NODE) {
            let prevTop = null;
            let lastLineStart = 0;

            for (let i = 0; i < originalText.length; i++) {
              range.setStart(textNode, i);
              range.setEnd(textNode, i + 1);
              const rect = range.getBoundingClientRect();
              const charTop = Math.round(rect.top);

              if (prevTop !== null && charTop > prevTop + 2) {
                lastLineStart = i;
              }
              prevTop = charTop;
            }

            const lastLineText = originalText.substring(lastLineStart).trim();
            lastLineWords = lastLineText.split(/[ \t\r\n]+/).filter(w => w.length > 0).length;
          }

          if (lastLineWords >= 2) {
            orphanFixed = true;
            break;
          }

          fontSize -= 2;
        }

        titleBox.style.fontSize = fontSize + "px";
      }

      titleBox.querySelector("#title-text").textContent = "";
    }

    // Resolve video/image fallback
    const videoEl = document.getElementById("card-video");
    const imgEl = document.getElementById("card-image");
    const imgSrc = imgEl ? (imgEl.getAttribute("src") || "") : "";
    if (imgSrc) {
      imgEl.style.display = "block";
      if (videoEl) videoEl.style.display = "none";
    } else {
      if (imgEl) imgEl.style.display = "none";
      if (videoEl) videoEl.style.display = "block";
    }

    // Populate and size all text fields
    applyAdaptiveSpeakerInfoSize(CARD_CONFIG.name, CARD_CONFIG.position_company);
    applyAdaptiveTextSize(CARD_CONFIG.title);

    // Typewriter
    const TOTAL_DUR = parseFloat(document.getElementById("root")?.getAttribute("data-duration") || "10");
    const TOTAL_TYPING_TIME = 4.8;
    const L1_START = 1.0;

    tl.to("#cursor", {
      opacity: 0, duration: 0.5, repeat: 1, yoyo: true, ease: "steps(1)"
    }, 0);
    tl.set("#cursor", { opacity: 1 }, L1_START);
    tl.to("#cursor", {
      opacity: 0, duration: 0.4, repeat: 9, yoyo: true, ease: "steps(1)"
    }, L1_START + TOTAL_TYPING_TIME);
    tl.to("#cursor", {
      opacity: 0, duration: 0.1, overwrite: "auto"
    }, TOTAL_DUR - 0.5);

    const typeObj = { n: 0 };
    tl.to(typeObj, {
      n: CARD_CONFIG.title.length,
      duration: TOTAL_TYPING_TIME,
      ease: "none",
      onUpdate: () => {
        document.getElementById("title-text").textContent = CARD_CONFIG.title.slice(0, Math.floor(typeObj.n));
      }
    }, L1_START);

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => {
        applyAdaptiveSpeakerInfoSize(CARD_CONFIG.name, CARD_CONFIG.position_company);
        applyAdaptiveTextSize(CARD_CONFIG.title);
        if (!window.__HYPERFRAMES__ && window.location.search.includes("static")) {
          document.getElementById("title-text").textContent = CARD_CONFIG.title;
        } else if (tl.time() > 0) {
          document.getElementById("title-text").textContent = CARD_CONFIG.title.slice(0, Math.floor(typeObj.n));
        }
      });
    }

    window.__timelines["main"] = tl;

    window.updateCard = (config) => {
      if (config.title !== undefined) CARD_CONFIG.title = config.title;
      if (config.name !== undefined) CARD_CONFIG.name = config.name;
      if (config.position_company !== undefined) CARD_CONFIG.position_company = config.position_company;
      if (config.year !== undefined) CARD_CONFIG.year = config.year;

      applyAdaptiveSpeakerInfoSize(CARD_CONFIG.name, CARD_CONFIG.position_company);
      applyAdaptiveTextSize(CARD_CONFIG.title);
      tl.progress(1);
    };

    // Standalone preview support
    if (!window.__HYPERFRAMES__) {
      document.querySelectorAll('.clip').forEach(el => el.style.visibility = 'visible');
      if (window.location.search.includes('static')) {
        tl.progress(1);
        document.getElementById("title-text").textContent = CARD_CONFIG.title;
        const cursor = document.getElementById("cursor");
        if (cursor) cursor.style.display = 'none';
      } else {
        tl.play();
      }
    }
  </script>
</body>

</html>
