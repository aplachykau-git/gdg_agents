<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    @font-face {
      font-family: 'Google Sans';
      src: url('assets/fonts/GoogleSans-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }

    @font-face {
      font-family: 'Google Sans';
      src: url('assets/fonts/%20GoogleSans-Medium.ttf') format('truetype');
      font-weight: 500;
      font-style: normal;
    }

    @font-face {
      font-family: 'Google Sans';
      src: url('assets/fonts/%20GoogleSans-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
    }

    :root {
      --bg-color: #EEEEEE;
      --text-primary: #1E1E1E;
      --text-secondary: #70757A;
      --devfest-green: #34A853;
      --accent-yellow: #F9AB00;
      --border-dark: #1E1E1E;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: var(--bg-color);
      font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--text-primary);
      user-select: none;
    }

    /* Ambient Subtle Tech Mesh Background */
    .bg-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      background-image: radial-gradient(rgba(0, 0, 0, 0.035) 1.5px, transparent 1.5px);
      background-size: 36px 36px;
      pointer-events: none;
      z-index: 0;
    }

    /* Ambient Warm Glows */
    .glow-left {
      position: absolute;
      width: 800px;
      height: 800px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(52, 168, 83, 0.05) 0%, transparent 70%);
      top: -200px;
      left: 100px;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }

    .glow-right {
      position: absolute;
      width: 700px;
      height: 700px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(249, 171, 0, 0.05) 0%, transparent 70%);
      bottom: -150px;
      right: 150px;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }

    /* Core HyperFrames Clip Layer */
    .clip {
      position: absolute;
      visibility: hidden; /* Managed by HyperFrames runtime */
      width: 1920px;
      height: 1080px;
      left: 0;
      top: 0;
      z-index: 10;
    }

    /* Video / Image Card Placeholder & Border */
    .card-slot {
      position: absolute;
      left: 127px;
      top: 130px;
      width: 585px;
      height: 821px;
      border-radius: 43px;
      background: #FFFFFF;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.05);
      z-index: 4;
    }

    #card-video,
    #card-image {
      position: absolute;
      left: 127px;
      top: 130px;
      width: 585px;
      height: 821px;
      object-fit: cover;
      object-position: center center;
      border-radius: 43px;
      z-index: 5;
    }

    .video-border-frame {
      position: absolute;
      left: 127px;
      top: 130px;
      width: 585px;
      height: 821px;
      border-radius: 43px;
      border: 3.5px solid var(--border-dark);
      pointer-events: none;
      z-index: 6;
      box-sizing: border-box;
    }

    /* Right Side Main Stage: Perfectly aligned with video card vertically (130px -> 951px = 821px) */
    .stage-container {
      position: absolute;
      left: 846px;
      top: 130px;
      width: 955px;
      height: 821px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 20;
    }

    /* ========================================================================
       TOP HEADER: DEVFEST LOGO, BADGE, SYMBOLS, WAVES & DOTS (PURE HTML + CSS)
       ======================================================================== */
    .header-block {
      display: flex;
      flex-direction: column;
      gap: 22px;
      flex-shrink: 0;
    }

    .header-row-top {
      display: flex;
      align-items: center;
      gap: 36px;
    }

    /* DevFest Brand Cluster: { DevFest } */
    .devfest-brand-cluster {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    /* Pure CSS DevFest Green Brackets (Exact Google Brand Style, Zero SVG) */
    .devfest-bracket {
      position: relative;
      width: 32px;
      height: 136px;
      flex-shrink: 0;
    }

    .devfest-bracket.left {
      background: var(--devfest-green);
      clip-path: polygon(
        100% 0%,
        24% 0%,
        24% 42%,
        0% 50%,
        24% 58%,
        24% 100%,
        100% 100%,
        100% 84%,
        52% 84%,
        52% 58%,
        26% 50%,
        52% 42%,
        52% 16%,
        100% 16%
      );
      filter: drop-shadow(2.5px 0 0 var(--border-dark)) drop-shadow(-2.5px 0 0 var(--border-dark)) drop-shadow(0 2.5px 0 var(--border-dark)) drop-shadow(0 -2.5px 0 var(--border-dark));
    }

    .devfest-bracket.right {
      background: var(--devfest-green);
      clip-path: polygon(
        100% 0%,
        24% 0%,
        24% 42%,
        0% 50%,
        24% 58%,
        24% 100%,
        100% 100%,
        100% 84%,
        52% 84%,
        52% 58%,
        26% 50%,
        52% 42%,
        52% 16%,
        100% 16%
      );
      transform: scaleX(-1);
      filter: drop-shadow(2.5px 0 0 var(--border-dark)) drop-shadow(-2.5px 0 0 var(--border-dark)) drop-shadow(0 2.5px 0 var(--border-dark)) drop-shadow(0 -2.5px 0 var(--border-dark));
    }

    .devfest-center-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .devfest-text {
      font-family: 'Google Sans', sans-serif;
      font-size: 82px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 0.95;
      letter-spacing: -0.025em;
    }

    .city-pill-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 38px;
      padding: 0 46px;
      background: #FFFFFF;
      border: 2.5px solid var(--border-dark);
      border-radius: 999px;
      font-family: 'Google Sans', sans-serif;
      font-size: 21px;
      font-weight: 500;
      color: var(--text-primary);
      letter-spacing: 0.015em;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
    }

    /* Code Symbols: # and { } */
    .code-symbols {
      display: flex;
      align-items: center;
      gap: 22px;
      color: var(--text-primary);
    }

    .sym-hash {
      font-family: 'Google Sans', -apple-system, sans-serif;
      font-size: 88px;
      font-weight: 300;
      line-height: 1;
      transform: rotate(3deg);
      opacity: 0.92;
    }

    .sym-braces {
      font-family: 'Google Sans', -apple-system, sans-serif;
      font-size: 98px;
      font-weight: 300;
      line-height: 1;
      letter-spacing: 6px;
      opacity: 0.92;
    }

    /* Decorative Row: Wave Arcs + 3 Yellow Dots (Pure HTML/CSS, Zero SVG) */
    .decor-row {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-left: 2px;
    }

    .scallop-wave {
      display: flex;
      align-items: flex-end;
    }

    .scallop {
      display: inline-block;
      width: 44px;
      height: 22px;
      border-top: 3px solid var(--border-dark);
      border-left: 3px solid var(--border-dark);
      border-right: 3px solid var(--border-dark);
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      margin-right: -3px;
      box-sizing: border-box;
      background: transparent;
    }

    .yellow-dots {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .dot {
      display: inline-block;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--accent-yellow);
      border: 3px solid var(--border-dark);
      box-sizing: border-box;
    }

    /* ========================================================================
       MAIN TEXT GROUP: TITLE & SPEAKER INFO (MATCHES BUILD WITH AI STANDARD)
       ======================================================================== */
    .title-box {
      font-family: 'Google Sans', sans-serif;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.025em;
      line-height: 1.2;
      white-space: pre-wrap;
      word-break: break-word;
      margin: 32px 0;
      text-align: left;
    }

    .speaker-info {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: auto;
      text-align: left;
    }

    .speaker-name {
      font-size: 48px;
      font-weight: 500;
      color: var(--text-primary);
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .speaker-company {
      font-size: 44px;
      font-weight: 400;
      color: var(--text-secondary);
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Blinking trailing typewriter cursor */
    .cursor-span {
      font-weight: 100;
      display: inline;
      padding-left: 2px;
      line-height: 1;
    }
  </style>
</head>

<body>
  <div id="root" data-composition-id="main" data-width="1920" data-height="1080" data-start="0" data-duration="10">
    <!-- Ambient Canvas & Background Glows -->
    <div class="bg-canvas"></div>
    <div class="glow-left"></div>
    <div class="glow-right"></div>

    <!-- Video / Image Card: Direct children of #root as required by HyperFrames -->
    <div class="card-slot"></div>
    <video id="card-video" src="assets/Video_example.mp4" data-start="0" data-duration="10" data-track-index="0" muted
      playsinline class="clip"></video>
    <img id="card-image" src="" data-start="0" data-duration="10" data-track-index="2" class="clip"
      style="display:none;">
    <div id="video_border" class="video-border-frame"></div>

    <!-- MAIN TIMED COMPOSITION SCENE -->
    <div id="main-scene" class="clip" data-start="0" data-duration="10" data-track-index="1">
      <div class="stage-container">
        <!-- Pure Semantic HTML Header (DevFest, Kraków Pill, Code Symbols, Decorative Waves & Dots) -->
        <div class="header-block">
          <div class="header-row-top">
            <!-- DevFest Brand Cluster with pure CSS Brackets -->
            <div class="devfest-brand-cluster" id="devfest-cluster">
              <div class="devfest-bracket left" id="bracket-left"></div>
              <div class="devfest-center-col" id="devfest-center">
                <div class="devfest-text" id="devfest-text">DevFest</div>
                <div class="city-pill-badge" id="city-badge">
                  <span id="pill-text">Kraków</span>
                </div>
              </div>
              <div class="devfest-bracket right" id="bracket-right"></div>
            </div>

            <!-- Modern Typographic Code Symbols -->
            <div class="code-symbols" id="code-symbols">
              <span class="sym-hash" id="sym-hash">#</span>
              <span class="sym-braces" id="sym-braces">{ }</span>
            </div>
          </div>

          <!-- Decorative Wave & Yellow Dots Row (100% Pure HTML/CSS) -->
          <div class="decor-row" id="decor-row">
            <div class="scallop-wave wave-left">
              <span class="scallop"></span>
              <span class="scallop"></span>
              <span class="scallop"></span>
              <span class="scallop"></span>
            </div>
            <div class="yellow-dots">
              <span class="dot dot-1"></span>
              <span class="dot dot-2"></span>
              <span class="dot dot-3"></span>
            </div>
            <div class="scallop-wave wave-right">
              <span class="scallop"></span>
              <span class="scallop"></span>
              <span class="scallop"></span>
              <span class="scallop"></span>
            </div>
          </div>
        </div>

        <!-- Adaptive Title Box (Strictly no leading indentation whitespace) -->
        <div id="title-box" class="title-box" data-layout-allow-overflow="true"><span id="title-text">Keeping it Cool: Avoiding Crisis-based Leadership (and work)</span><span id="cursor" class="cursor-span">|</span></div>

        <!-- Speaker Info (Pinned to bottom, aligning with video frame bottom at 951px) -->
        <div class="speaker-info" data-layout-allow-overflow="true">
          <div id="name" class="speaker-name" data-layout-allow-overflow="true">Adi Mazor Kario, Developer Cloud</div>
          <div id="position_company" class="speaker-company" data-layout-allow-overflow="true">Company Google Foundation</div>
        </div>
      </div>
    </div>
  </div>

  <!-- GSAP Animation Timeline & Runtime Registration -->
  <script>
    // Initialize GSAP Timeline
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // 1. Header elements entrance animations
    tl.fromTo(["#bracket-left"],
      { x: -28, opacity: 0, scale: 0.9 },
      { x: 0, opacity: 1, scale: 1, duration: 1.2, ease: "back.out(1.8)" },
      0.2
    );

    tl.fromTo(["#bracket-right"],
      { x: 28, opacity: 0, scale: 0.9 },
      { x: 0, opacity: 1, scale: 1, duration: 1.2, ease: "back.out(1.8)" },
      0.2
    );

    tl.fromTo("#devfest-text",
      { y: -15, opacity: 0 },
      { y: 0, opacity: 1, duration: 1.0, ease: "power2.out" },
      0.3
    );

    tl.fromTo("#city-badge",
      { y: 15, opacity: 0, scale: 0.92 },
      { y: 0, opacity: 1, scale: 1, duration: 1.0, ease: "back.out(1.5)" },
      0.4
    );

    tl.fromTo("#code-symbols",
      { scale: 0.7, opacity: 0, rotation: -8 },
      { scale: 1, opacity: 1, rotation: 0, duration: 1.4, ease: "back.out(1.4)" },
      0.5
    );

    // 2. Wave scallops and dots animation
    tl.fromTo(".scallop",
      { scaleY: 0, transformOrigin: "bottom center", opacity: 0 },
      { scaleY: 1, opacity: 1, duration: 0.6, stagger: 0.06, ease: "power2.out" },
      0.7
    );

    tl.fromTo(".dot",
      { scale: 0 },
      { scale: 1, duration: 0.7, stagger: 0.14, ease: "back.out(2.2)" },
      0.9
    );

    // Subtle rhythmic breathing on the 3 yellow dots throughout the video
    tl.to(".dot", {
      scale: 1.14,
      duration: 0.9,
      yoyo: true,
      repeat: 6,
      stagger: 0.12,
      ease: "sine.inOut"
    }, 2.2);

    // 3. Video card, static image fallback, and border fade in cleanly
    tl.fromTo(["#card-video", "#card-image", "#video_border"],
      { opacity: 0 },
      { opacity: 1, duration: 2.0, ease: "power2.out" },
      0.3
    );

    // 4. Title container fades in in-place as it begins typing
    tl.fromTo("#title-box",
      { opacity: 0 },
      { opacity: 1, duration: 1.8, ease: "power3.out" },
      1.0
    );

    // 5. Speaker Name and Company slide up staggered
    tl.fromTo("#name",
      { y: 50, opacity: 0 },
      { y: 0, opacity: 1, duration: 1.8, ease: "power3.out" },
      1.8
    );

    tl.fromTo("#position_company",
      { y: 50, opacity: 0 },
      { y: 0, opacity: 1, duration: 1.8, ease: "power3.out" },
      2.2
    );

    // ========================================================================
    // ✍️ CARD CONFIGURATION (Standard contract for Video Editor)
    // ========================================================================
    const CARD_CONFIG = {
      title: "Keeping it Cool:\nAvoiding Crisis-based\nLeadership (and work)",
      name: "Adi Mazor Kario, Developer Cloud",
      position_company: "Company Google Foundation",
      year: "Kraków"
    };

    // Adaptive text sizing function — calculates optimal font size for any title length
    function applyAdaptiveTextSize(title) {
      const titleBox = document.getElementById("title-box");
      const maxWidth = 955;   // container width in px
      const maxHeight = 320;  // max vertical space for title

      titleBox.querySelector("#title-text").textContent = title;

      // Multi-line search starting at 72px (optimal for 2-3 lines)
      let fontSize = 72;
      const minFontSize = 36;
      while (fontSize > minFontSize) {
        titleBox.style.fontSize = fontSize + "px";
        if (titleBox.scrollHeight <= maxHeight && titleBox.scrollWidth <= maxWidth) {
          break;
        }
        fontSize -= 2;
      }

      titleBox.style.fontSize = fontSize + "px";

      // Typographic orphan resolution for text without manual newlines
      if (!title.includes("\n") && title.trim().split(/\s+/).length > 2) {
        const minOrphanFontSize = Math.max(fontSize - 12, 36);
        while (fontSize > minOrphanFontSize) {
          titleBox.style.fontSize = fontSize + "px";
          const textSpan = titleBox.querySelector("#title-text");
          const originalText = textSpan.textContent;
          const range = document.createRange();
          const textNode = textSpan.firstChild;

          let lastLineWords = 0;
          if (textNode && textNode.nodeType === Node.TEXT_NODE) {
            let prevTop = null;
            let lastLineStart = 0;
            for (let i = 0; i < originalText.length; i++) {
              range.setStart(textNode, i);
              range.setEnd(textNode, i + 1);
              const rect = range.getBoundingClientRect();
              const charTop = Math.round(rect.top);
              if (prevTop !== null && charTop > prevTop + 2) {
                lastLineStart = i;
              }
              prevTop = charTop;
            }
            const lastLineText = originalText.substring(lastLineStart).trim();
            lastLineWords = lastLineText.split(/\s+/).filter(w => w.length > 0).length;
          }

          if (lastLineWords >= 2) break;
          fontSize -= 2;
        }
        titleBox.style.fontSize = fontSize + "px";
      }

      titleBox.querySelector("#title-text").textContent = "";
    }

    // Adaptive speaker info sizing function
    function applyAdaptiveSpeakerInfoSize(name, positionCompany) {
      const nameEl = document.getElementById("name");
      const companyEl = document.getElementById("position_company");
      const maxWidth = 955;

      nameEl.textContent = name;
      companyEl.textContent = positionCompany;

      nameEl.style.whiteSpace = "nowrap";
      companyEl.style.whiteSpace = "nowrap";

      let fontSize = 48;
      const minFontSize = 24;

      while (fontSize > minFontSize) {
        nameEl.style.fontSize = fontSize + "px";
        companyEl.style.fontSize = (fontSize - 4) + "px";

        if (nameEl.scrollWidth <= maxWidth && companyEl.scrollWidth <= maxWidth) {
          break;
        }
        fontSize -= 1;
      }

      nameEl.style.fontSize = fontSize + "px";
      companyEl.style.fontSize = (fontSize - 4) + "px";
    }

    // Resolve video / image fallback
    const videoEl = document.getElementById("card-video");
    const imgEl = document.getElementById("card-image");
    const imgSrc = imgEl.getAttribute("src") || "";

    if (imgSrc) {
      imgEl.style.display = "block";
      videoEl.style.display = "none";
    } else {
      imgEl.style.display = "none";
      videoEl.style.display = "block";
    }

    // 1. Populate text fields
    const pillEl = document.getElementById("pill-text");
    if (pillEl) {
      pillEl.textContent = CARD_CONFIG.year.length > 4 ? CARD_CONFIG.year : (CARD_CONFIG.year === "2026" ? "Kraków" : CARD_CONFIG.year);
    }
    applyAdaptiveSpeakerInfoSize(CARD_CONFIG.name, CARD_CONFIG.position_company);
    applyAdaptiveTextSize(CARD_CONFIG.title);

    // 2. Dynamic Typewriter
    const TOTAL_TYPING_TIME = 4.8;
    const L1_START = 1.0;

    tl.to("#cursor", {
      opacity: 0, duration: 0.5, repeat: 1, yoyo: true, ease: "steps(1)"
    }, 0);

    tl.set("#cursor", { opacity: 1 }, L1_START);

    tl.to("#cursor", {
      opacity: 0, duration: 0.4, repeat: 9, yoyo: true, ease: "steps(1)"
    }, L1_START + TOTAL_TYPING_TIME);

    tl.to("#cursor", {
      opacity: 0, duration: 0.01, overwrite: "auto"
    }, 9.8);

    const typeObj = { n: 0 };
    tl.to(typeObj, {
      n: CARD_CONFIG.title.length,
      duration: TOTAL_TYPING_TIME,
      ease: "none",
      onUpdate: () => {
        document.getElementById("title-text").textContent = CARD_CONFIG.title.slice(0, Math.floor(typeObj.n));
      }
    }, L1_START);

    // Register timeline under the 'main' composition ID for HyperFrames
    window.__timelines["main"] = tl;

    // Standalone browser preview helper (makes clips visible and seeks to end in standalone test)
    document.querySelectorAll('.clip').forEach(el => el.style.visibility = 'visible');
    const isStandalone = !window.__HYPERFRAMES_RUNNING__;
    if (isStandalone) {
      tl.progress(1);
      document.getElementById("title-text").textContent = CARD_CONFIG.title;
    }

    // Helper API to dynamically update the card texts from browser or server
    window.updateCard = (config) => {
      if (config.title !== undefined) CARD_CONFIG.title = config.title;
      if (config.name !== undefined) CARD_CONFIG.name = config.name;
      if (config.position_company !== undefined) CARD_CONFIG.position_company = config.position_company;
      if (config.year !== undefined) CARD_CONFIG.year = config.year;

      if (pillEl) {
        pillEl.textContent = CARD_CONFIG.year.length > 4 ? CARD_CONFIG.year : (CARD_CONFIG.year === "2026" ? "Kraków" : CARD_CONFIG.year);
      }
      applyAdaptiveSpeakerInfoSize(CARD_CONFIG.name, CARD_CONFIG.position_company);
      applyAdaptiveTextSize(CARD_CONFIG.title);

      tl.progress(1);
    };
  </script>
</body>

</html>
