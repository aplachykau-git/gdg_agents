<!DOCTYPE html>
<!-- DEVFEST TEMPLATE -->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    @font-face {
      font-family: 'Google Sans';
      src: url('assets/fonts/GoogleSans-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }

    @font-face {
      font-family: 'Google Sans';
      src: url('assets/fonts/%20GoogleSans-Medium.ttf') format('truetype');
      font-weight: 500;
      font-style: normal;
    }

    @font-face {
      font-family: 'Google Sans';
      src: url('assets/fonts/%20GoogleSans-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
    }

    :root {
      --bg-color: #EFEFEF;
      --text-primary: #1E1E1E;
      --text-secondary: #70757A;
      --devfest-green: #34A853;
      --accent-yellow: #FBBC04;
      --border-dark: #1E1E1E;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: var(--bg-color);
      font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--text-primary);
      user-select: none;
    }

    /* Subtle background grid */
    .bg-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      background-image: radial-gradient(rgba(0, 0, 0, 0.035) 1.5px, transparent 1.5px);
      background-size: 36px 36px;
      pointer-events: none;
      z-index: 0;
    }

    /* Core HyperFrames Clip Layer */
    .clip {
      position: absolute;
      visibility: hidden; /* Managed by HyperFrames runtime */
      width: 1920px;
      height: 1080px;
      left: 0;
      top: 0;
      z-index: 10;
    }

    /* ========================================================================
       LEFT CARD: EXACT FIGMA DIMENSIONS (160px left, 165px top, 570x750px)
       ======================================================================== */
    .card-slot {
      position: absolute;
      left: 160px;
      top: 165px;
      width: 570px;
      height: 750px;
      border-radius: 40px;
      background: #1E1E1E;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.06);
      z-index: 4;
    }

    #card-video,
    #card-image {
      position: absolute;
      left: 160px;
      top: 165px;
      width: 570px;
      height: 750px;
      object-fit: cover;
      object-position: center center;
      border-radius: 40px;
      z-index: 5;
    }

    .video-border-frame {
      position: absolute;
      left: 160px;
      top: 165px;
      width: 570px;
      height: 750px;
      border-radius: 40px;
      border: 3.5px solid var(--border-dark);
      pointer-events: none;
      z-index: 6;
      box-sizing: border-box;
    }

    /* ========================================================================
       RIGHT CONTENT COLUMN: EXACT FIGMA POSITIONING (left: 860px, top: 165px)
       ======================================================================== */
    .stage-container {
      position: absolute;
      left: 860px;
      top: 165px;
      width: 900px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      z-index: 20;
    }

    /* 1. HEADER ROW: DevFest Logo + # { } */
    .header-block {
      display: flex;
      flex-direction: column;
      gap: 34px;
      width: 100%;
    }

    .header-row-top {
      display: flex;
      align-items: center;
      gap: 38px;
    }

    .devfest-brand-cluster {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    /* Crisp DevFest Brackets */
    .bracket-svg {
      width: 36px;
      height: 130px;
      flex-shrink: 0;
    }

    .bracket-svg.right {
      transform: scaleX(-1);
    }

    .devfest-center-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .devfest-text {
      font-family: 'Google Sans', sans-serif;
      font-size: 78px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .city-pill-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 320px;
      height: 34px;
      background: #FFFFFF;
      border: 2.5px solid var(--border-dark);
      border-radius: 999px;
      font-family: 'Google Sans', sans-serif;
      font-size: 20px;
      font-weight: 500;
      color: var(--text-primary);
      letter-spacing: 0.01em;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.03);
    }

    /* Modern Code Symbols: # and { } */
    .code-symbols {
      display: flex;
      align-items: center;
      gap: 24px;
      color: var(--text-primary);
    }

    .sym-hash {
      font-family: 'Google Sans', -apple-system, sans-serif;
      font-size: 86px;
      font-weight: 300;
      line-height: 1;
      transform: rotate(3deg);
      opacity: 0.95;
    }

    .sym-braces {
      font-family: 'Google Sans', -apple-system, sans-serif;
      font-size: 98px;
      font-weight: 300;
      line-height: 1;
      letter-spacing: 6px;
      opacity: 0.95;
    }

    /* 2. DECORATIVE ROW: Waves + 3 Yellow Dots */
    .decor-row {
      display: flex;
      align-items: center;
      gap: 22px;
      width: 100%;
      height: 42px;
    }

    .wave-svg {
      width: 212px;
      height: 40px;
      flex-shrink: 0;
    }

    .yellow-dots {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }

    .dot {
      display: block;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--accent-yellow);
      border: 3.5px solid var(--border-dark);
      box-sizing: border-box;
    }

    /* 3. TITLE BOX: EXACT FIGMA TYPOGRAPHY (Google Sans Bold 64px, line-height 1.18) */
    .title-box {
      margin-top: 50px;
      font-family: 'Google Sans', sans-serif;
      font-size: 64px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.025em;
      line-height: 1.18;
      white-space: pre-wrap;
      word-break: break-word;
      text-align: left;
      width: 880px;
    }

    /* 4. SPEAKER INFO: EXACT FIGMA SPACING & TYPOGRAPHY */
    .speaker-info {
      margin-top: 42px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-align: left;
    }

    .speaker-name {
      font-family: 'Google Sans', sans-serif;
      font-size: 36px;
      font-weight: 500;
      color: var(--text-primary);
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .speaker-company {
      font-family: 'Google Sans', sans-serif;
      font-size: 34px;
      font-weight: 400;
      color: var(--text-secondary);
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Blinking trailing typewriter cursor */
    .cursor-span {
      font-weight: 100;
      display: inline;
      padding-left: 2px;
      line-height: 1;
    }
  </style>
</head>

  <!-- GSAP Animation Timeline & Runtime Registration -->
  <script>
    // Initialize GSAP Timeline
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // 1. Header elements entrance animations
    tl.fromTo("#devfest-logo-vector",
      { scale: 0.94, opacity: 0 },
      { scale: 1, opacity: 1, duration: 1.2, ease: "back.out(1.6)" },
      0.2
    );

    tl.fromTo("#code-symbols",
      { scale: 0.7, opacity: 0, rotation: -8 },
      { scale: 1, opacity: 1, rotation: 0, duration: 1.4, ease: "back.out(1.4)" },
      0.5
    );

    // 2. Wave and dots animation
    tl.fromTo(".wave-svg path",
      { strokeDasharray: 300, strokeDashoffset: 300 },
      { strokeDashoffset: 0, duration: 1.2, ease: "power2.inOut" },
      0.7
    );

    tl.fromTo(".dot",
      { scale: 0 },
      { scale: 1, duration: 0.7, stagger: 0.14, ease: "back.out(2.2)" },
      0.9
    );

    // Subtle rhythmic breathing on the 3 yellow dots throughout the video
    tl.to(".dot", {
      scale: 1.12,
      duration: 0.9,
      yoyo: true,
      repeat: 6,
      stagger: 0.12,
      ease: "sine.inOut"
    }, 2.2);

    // 3. Video card, static image fallback, and border fade in cleanly
    tl.fromTo(["#card-video", "#card-image", "#video_border"],
      { opacity: 0 },
      { opacity: 1, duration: 2.0, ease: "power2.out" },
      0.3
    );

    // 4. Title container fades in in-place as it begins typing
    tl.fromTo("#title-box",
      { opacity: 0 },
      { opacity: 1, duration: 1.8, ease: "power3.out" },
      1.0
    );

    // 5. Speaker Name and Company slide up staggered
    tl.fromTo("#name",
      { y: 40, opacity: 0 },
      { y: 0, opacity: 1, duration: 1.8, ease: "power3.out" },
      1.8
    );

    tl.fromTo("#position_company",
      { y: 40, opacity: 0 },
      { y: 0, opacity: 1, duration: 1.8, ease: "power3.out" },
      2.2
    );

    // ========================================================================
    // ✍️ CARD CONFIGURATION (Standard contract for Video Editor)
    // ========================================================================
    const CARD_CONFIG = {
      title: "Keeping it Cool:\nAvoiding Crisis-based\nLeadership (and work)",
      name: "Adi Mazor Kario, Developer Cloud",
      position_company: "Company Google Foundation",
      year: "Kraków"
    };

    // Adaptive text sizing function — calculates optimal font size for any title length
    function applyAdaptiveTextSize(title) {
      const titleBox = document.getElementById("title-box");
      const maxWidth = 880;
      const maxHeight = 260;

      titleBox.querySelector("#title-text").textContent = title;

      let fontSize = 64;
      const minFontSize = 36;
      while (fontSize > minFontSize) {
        titleBox.style.fontSize = fontSize + "px";
        if (titleBox.scrollHeight <= maxHeight && titleBox.scrollWidth <= maxWidth) {
          break;
        }
        fontSize -= 2;
      }

      titleBox.style.fontSize = fontSize + "px";
      titleBox.querySelector("#title-text").textContent = "";
    }

    // Adaptive speaker info sizing function
    function applyAdaptiveSpeakerInfoSize(name, positionCompany) {
      const nameEl = document.getElementById("name");
      const companyEl = document.getElementById("position_company");
      const maxWidth = 880;

      nameEl.textContent = name;
      companyEl.textContent = positionCompany;

      nameEl.style.whiteSpace = "nowrap";
      companyEl.style.whiteSpace = "nowrap";

      let fontSize = 36;
      const minFontSize = 20;

      while (fontSize > minFontSize) {
        nameEl.style.fontSize = fontSize + "px";
        companyEl.style.fontSize = (fontSize - 2) + "px";

        if (nameEl.scrollWidth <= maxWidth && companyEl.scrollWidth <= maxWidth) {
          break;
        }
        fontSize -= 1;
      }

      nameEl.style.fontSize = fontSize + "px";
      companyEl.style.fontSize = (fontSize - 2) + "px";
    }

    // Resolve video / image fallback
    const videoEl = document.getElementById("card-video");
    const imgEl = document.getElementById("card-image");
    const imgSrc = imgEl.getAttribute("src") || "";

    if (imgSrc) {
      imgEl.style.display = "block";
      videoEl.style.display = "none";
    } else {
      imgEl.style.display = "none";
      videoEl.style.display = "block";
    }

    // 1. Populate text fields
    const pillEl = document.getElementById("pill-text");
    if (pillEl) {
      pillEl.textContent = CARD_CONFIG.year.length > 4 ? CARD_CONFIG.year : (CARD_CONFIG.year === "2026" ? "Kraków" : CARD_CONFIG.year);
    }
    applyAdaptiveSpeakerInfoSize(CARD_CONFIG.name, CARD_CONFIG.position_company);
    applyAdaptiveTextSize(CARD_CONFIG.title);

    // 2. Dynamic Typewriter
    const TOTAL_TYPING_TIME = 4.8;
    const L1_START = 1.0;

    tl.to("#cursor", {
      opacity: 0, duration: 0.5, repeat: 1, yoyo: true, ease: "steps(1)"
    }, 0);

    tl.set("#cursor", { opacity: 1 }, L1_START);

    tl.to("#cursor", {
      opacity: 0, duration: 0.4, repeat: 9, yoyo: true, ease: "steps(1)"
    }, L1_START + TOTAL_TYPING_TIME);

    tl.to("#cursor", {
      opacity: 0, duration: 0.01, overwrite: "auto"
    }, 9.8);

    const typeObj = { n: 0 };
    tl.to(typeObj, {
      n: CARD_CONFIG.title.length,
      duration: TOTAL_TYPING_TIME,
      ease: "none",
      onUpdate: () => {
        document.getElementById("title-text").textContent = CARD_CONFIG.title.slice(0, Math.floor(typeObj.n));
      }
    }, L1_START);

    // Register timeline under the 'main' composition ID for HyperFrames
    window.__timelines["main"] = tl;

    // Standalone browser preview helper (makes clips visible and seeks to end in standalone test)
    document.querySelectorAll('.clip').forEach(el => el.style.visibility = 'visible');
    const isStandalone = !window.__HYPERFRAMES_RUNNING__;
    if (isStandalone) {
      tl.progress(1);
      document.getElementById("title-text").textContent = CARD_CONFIG.title;
    }

    // Helper API to dynamically update the card texts from browser or server
    window.updateCard = (config) => {
      if (config.title !== undefined) CARD_CONFIG.title = config.title;
      if (config.name !== undefined) CARD_CONFIG.name = config.name;
      if (config.position_company !== undefined) CARD_CONFIG.position_company = config.position_company;
      if (config.year !== undefined) CARD_CONFIG.year = config.year;

      if (pillEl) {
        pillEl.textContent = CARD_CONFIG.year.length > 4 ? CARD_CONFIG.year : (CARD_CONFIG.year === "2026" ? "Kraków" : CARD_CONFIG.year);
      }
      applyAdaptiveSpeakerInfoSize(CARD_CONFIG.name, CARD_CONFIG.position_company);
      applyAdaptiveTextSize(CARD_CONFIG.title);

      tl.progress(1);
    };
  </script>
</body>

</html>
