<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/MotionPathPlugin.min.js"></script>
  <style>
    @font-face {
      font-family: 'Google Sans';
      src: url('assets/fonts/GoogleSans-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }

    @font-face {
      font-family: 'Google Sans';
      src: url('assets/fonts/%20GoogleSans-Medium.ttf') format('truetype');
      font-weight: 500;
      font-style: normal;
    }

    @font-face {
      font-family: 'Google Sans';
      src: url('assets/fonts/%20GoogleSans-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
    }

    :root {
      --bg-color: #F0F0F0;
      --avatar-orange: #ff5f00;
      --avatar-green: #10b981;
      --text-primary: #1e1e1e;
      --text-secondary: #808793;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: var(--bg-color);
      font-family: 'Google Sans', sans-serif;
      color: var(--text-primary);
    }

    /* Tech Background Mesh */
    .grid-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      background-image:
        radial-gradient(rgba(255, 95, 0, 0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* Ambient Light Orbs */
    .glow-orb-orange {
      position: absolute;
      width: 800px;
      height: 800px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 95, 0, 0.08) 0%, transparent 70%);
      top: -150px;
      left: -100px;
      filter: blur(60px);
      pointer-events: none;
      z-index: 0;
    }

    .glow-orb-green {
      position: absolute;
      width: 700px;
      height: 700px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.05) 0%, transparent 70%);
      bottom: -150px;
      right: -100px;
      filter: blur(60px);
      pointer-events: none;
      z-index: 0;
    }

    /* Core Clip Layouts */
    .clip {
      position: absolute;
      visibility: hidden;
      /* Managed by HyperFrames runtime */
      width: 1920px;
      height: 1080px;
      left: 0;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* SVG Layout Wrapper */
    .svg-container {
      position: relative;
      width: 1920px;
      height: 1080px;
    }

    /* Unified Text Group: title + speaker-info in a grid layout.
       speaker-info is pinned to the bottom (aligned with video frame at 951px),
       title-box floats vertically centered in the remaining space above. */
    .text-group {
      position: absolute;
      left: 846px;
      top: 520px;
      width: 945px;
      height: 431px;
      /* bottom aligns with video frame bottom: 130 + 821 = 951px */
      display: grid;
      grid-template-rows: 1fr auto;
      row-gap: 28px;
      z-index: 20;
      pointer-events: none;
      font-family: 'Google Sans', sans-serif;
      overflow: hidden;
    }

    /* Premium Adaptive HTML Title Box — centered in the 1fr grid row */
    .title-box {
      align-self: center;
      font-weight: 700;
      color: #1e1e1e;
      letter-spacing: -0.02em;
      line-height: 1.2;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Speaker info block — pinned to the bottom of the grid (auto row) */
    .speaker-info {}

    .speaker-name {
      font-size: 52px;
      font-weight: 400;
      color: #1E1E1E;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .speaker-company {
      font-size: 52px;
      font-weight: 400;
      color: #808793;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Thin blinking cursor that trails the typewriter in HTML */
    .cursor-span {
      font-weight: 100;
      display: inline;
      padding-left: 2px;
      line-height: 1;
    }

    /* Waves and heart curves: initial hidden state for draw-in animation */
    .wave-path,
    .heart-path {
      stroke-dasharray: 120;
      stroke-dashoffset: 120;
    }
  </style>
</head>

  <!-- GSAP Animation Timeline & Runtime Registration -->
  <script>
    /************************************************************************
     * 🚀 QUICK CUSTOMIZATION GUIDE FOR REUSING THIS CARD
     * 
     * To spin up a new speaker card using this template:
     * 
     * 1. VIDEO: Replace 'src="assets/Video_example.mp4"' in the <video> tag
     *    at line ~145. Note: Video must remain a direct child of #root,
     *    have muted/playsinline, and keep object-fit:cover.
     * 
     * 2. TITLE LINE 1 & 2: Update the 'LINE1' and 'LINE2' constants
     *    at lines ~368-369 below to print your custom text.
     * 
     * 3. NAME & ROLE: Modify the <text id="employee"> and <text id="position">
     *    SVG elements at lines ~177-180 to set speaker details.
     * 
     * 4. CHECKS & RENDER:
     *    - Run `npm run check` to validate layout and performance.
     *    - Run `npm run render` to export the new high-quality MP4 file.
     ************************************************************************/

    // Initialize GSAP Timeline (Exactly 8 seconds)
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // 1. Slow 360-degree star rotation with acceleration and deceleration
    // Center coordinates: X = 1204.55px, Y = 168.7px
    tl.to("#star", {
      rotation: 360,
      duration: 10.0,
      ease: "power2.inOut",
      transformOrigin: "50% 50%"
    }, 0);

    // 2. Arrow — shaft grows left→right while the whole group slides 300px from right to left.
    //    Net effect: construction starts to the right and "lands" into final position (tree-on-stalk).
    tl.fromTo("#arrow_group",
      { x: 300 },
      { x: 0, duration: 5.0, ease: "power2.inOut" },
      0
    );
    tl.fromTo("#arrow_shaft",
      { strokeDashoffset: 350 },
      { strokeDashoffset: 0, duration: 5.0, ease: "power2.inOut" },
      0
    );

    // 4. Compass — svgOrigin in BOTH from and to keeps the pivot locked at the visual center.
    //    The group has translate(1704,216) baked in; svgOrigin "1704 216" references that center.
    tl.fromTo("#compass_wrapper",
      { scale: 0.1, rotation: -720, svgOrigin: "1704 216" },
      {
        scale: 1,
        rotation: 0,
        svgOrigin: "1704 216",
        duration: 7.0,
        ease: "back.out(1.5)"
      },
      0
    );

    // 5. Circle — pops in with a bounce, then pulses continuously (breathing heartbeat effect).
    //    Center coordinates: X = 1536.18px, Y = 438.539px
    tl.fromTo("#circle",
      { scale: 0, svgOrigin: "1536.18 438.539" },
      { scale: 1, svgOrigin: "1536.18 438.539", duration: 2.0, ease: "back.out(1.7)" },
      0.8
    );
    tl.to("#circle", {
      scale: 1.08,
      svgOrigin: "1536.18 438.539",
      duration: 1.0,
      yoyo: true,
      repeat: 6, // 6 repeats (7 half-cycles) ends perfectly at scale 1.0 at T = 9.8s
      ease: "power1.inOut"
    }, 2.8);

    // 6. Waves under the pill badge — draw themselves dynamically left-to-right sequentially.
    tl.to(".wave-path", {
      strokeDashoffset: 0,
      duration: 0.8,
      ease: "power2.inOut",
      stagger: 0.6
    }, 1.5);

    // 7. Video card, static image fallback, and border fade in cleanly (fixed in place)
    tl.fromTo(["#card-video", "#card-image", "#video_border"],
      { opacity: 0 },
      { opacity: 1, duration: 2.5, ease: "power2.out" },
      0.4
    );

    // 8. Title container fades in cleanly in-place as it begins typing
    tl.fromTo("#title-box",
      { opacity: 0 },
      { opacity: 1, duration: 2.0, ease: "power3.out" },
      1.0
    );

    // 9. Speaker Name slides up and fades in
    tl.fromTo("#name",
      { y: 60, opacity: 0 },
      { y: 0, opacity: 1, duration: 2.0, ease: "power3.out" },
      1.8
    );

    // 10. Speaker Position/Company slides up and fades in staggered
    tl.fromTo("#position_company",
      { y: 60, opacity: 0 },
      { y: 0, opacity: 1, duration: 2.0, ease: "power3.out" },
      2.2
    );

    // 11. Heart shape ("3" curves on the right) draws in sequentially
    tl.to(["#heart_top", "#heart_bottom"], {
      strokeDashoffset: 0,
      duration: 0.8,
      ease: "power2.inOut",
      stagger: 0.3
    }, 2.5);

    // ========================================================================
    // ✍️ CARD CONFIGURATION (Unified config for rapid customized reuse!)
    // ========================================================================
    const CARD_CONFIG = {
      title: "You can lose yourself in mobile world",
      name: "Fedor Bravo",
      position_company: "Farmer",
      year: "2026"
    };

    // Adaptive text sizing function — calculates optimal font size for any title length
    // and eliminates typographic orphans (single short words stranded on the last line).
    function applyAdaptiveTextSize(title) {
      const titleBox = document.getElementById("title-box");
      const maxWidth = 945;   // container width in px
      const maxHeight = 280;  // max vertical space for the title before it eats into speaker info

      titleBox.querySelector("#title-text").textContent = title;

      // 1. Try to fit the text on a single line by scaling up (up to 110px)
      let fontSize = 110;
      let fitsOnSingleLine = false;

      while (fontSize >= 84) {
        titleBox.style.fontSize = fontSize + "px";
        titleBox.style.whiteSpace = "nowrap";
        const width = titleBox.scrollWidth;
        titleBox.style.whiteSpace = ""; // restore to stylesheet rule (pre-wrap)

        if (width <= maxWidth) {
          fitsOnSingleLine = true;
          break; // Found the largest font size where it fits on a single line!
        }
        fontSize -= 2;
      }

      // 2. If it cannot fit on a single line at >= 84px, fall back to standard multi-line search
      if (!fitsOnSingleLine) {
        fontSize = 84;
        const minFontSize = 36;
        while (fontSize > minFontSize) {
          titleBox.style.fontSize = fontSize + "px";
          if (titleBox.scrollHeight <= maxHeight && titleBox.scrollWidth <= maxWidth) {
            break;
          }
          fontSize -= 2;
        }
      }

      titleBox.style.fontSize = fontSize + "px";

      // 3. Anti-orphan correction: detect and fix single short words stranded on the last line.
      //    A "typographic orphan" is when the last line of wrapped text contains only one word
      //    (e.g. "Stop using it\nwrongly!" — "wrongly!" alone looks unbalanced).
      //    We fix this by slightly reducing the font size so the browser reflows at least
      //    two words onto the last line, producing a visually balanced block.
      if (!fitsOnSingleLine && title.trim().split(/\s+/).length > 2) {
        const minOrphanFontSize = Math.max(fontSize - 12, 36); // don't shrink more than 12px
        let orphanFixed = false;

        while (fontSize > minOrphanFontSize) {
          titleBox.style.fontSize = fontSize + "px";

          // Measure orphan status: use a temporary invisible clone to count words per line.
          // We measure by checking if the last line contains only one short word.
          const words = title.trim().split(/\s+/);
          const lineHeight = parseFloat(getComputedStyle(titleBox).lineHeight) || (fontSize * 1.2);
          const totalTextHeight = titleBox.scrollHeight;
          const lineCount = Math.round(totalTextHeight / lineHeight);

          if (lineCount <= 1) break; // Single-line text has no orphan problem

          // Create a temporary measurement span to find where the last line break occurs
          const textSpan = titleBox.querySelector("#title-text");
          const originalText = textSpan.textContent;
          
          // Binary approach: find the last word that starts on a new line
          // by measuring text width incrementally
          let lastLineWords = 0;
          let lastLineStartIdx = 0;
          
          // Measure using Range API to find the actual last line
          const range = document.createRange();
          const textNode = textSpan.firstChild;
          
          if (textNode && textNode.nodeType === Node.TEXT_NODE) {
            let prevTop = null;
            let lastLineStart = 0;
            
            for (let i = 0; i < originalText.length; i++) {
              range.setStart(textNode, i);
              range.setEnd(textNode, i + 1);
              const rect = range.getBoundingClientRect();
              const charTop = Math.round(rect.top);
              
              if (prevTop !== null && charTop > prevTop + 2) {
                // New line detected at character index i
                lastLineStart = i;
              }
              prevTop = charTop;
            }
            
            // Extract the text on the last line and count its words
            const lastLineText = originalText.substring(lastLineStart).trim();
            lastLineWords = lastLineText.split(/\s+/).filter(w => w.length > 0).length;
          }

          // If the last line has 2+ words, the orphan is resolved!
          if (lastLineWords >= 2) {
            orphanFixed = true;
            break;
          }

          // Shrink font to try pushing more words onto the last line
          fontSize -= 2;
        }

        // If we couldn't fix the orphan within the allowed range, restore the best fit
        titleBox.style.fontSize = fontSize + "px";
      }
      
      // Reset text content to empty string so it doesn't flicker on start before typewriter tween plays!
      titleBox.querySelector("#title-text").textContent = "";
    }

    // Adaptive speaker info sizing function — shrinks name and position/company text size
    // so that the position/company line always fits in a single line.
    function applyAdaptiveSpeakerInfoSize(name, positionCompany) {
      const nameEl = document.getElementById("name");
      const companyEl = document.getElementById("position_company");
      const maxWidth = 945; // max container width in px

      nameEl.textContent = name;
      companyEl.textContent = positionCompany;

      // Temporarily ensure nowrap to correctly measure single-line text width
      nameEl.style.whiteSpace = "nowrap";
      companyEl.style.whiteSpace = "nowrap";

      let fontSize = 52;
      const minFontSize = 24;

      while (fontSize > minFontSize) {
        nameEl.style.fontSize = fontSize + "px";
        companyEl.style.fontSize = fontSize + "px";

        if (nameEl.scrollWidth <= maxWidth && companyEl.scrollWidth <= maxWidth) {
          break;
        }
        fontSize -= 1;
      }

      nameEl.style.fontSize = fontSize + "px";
      companyEl.style.fontSize = fontSize + "px";
    }

    // Resolve video/image fallback dynamically based on whether card-image has a source
    const videoEl = document.getElementById("card-video");
    const imgEl = document.getElementById("card-image");
    const imgSrc = imgEl.getAttribute("src") || "";
    
    if (imgSrc) {
      imgEl.style.display = "block";
      videoEl.style.display = "none";
    } else {
      imgEl.style.display = "none";
      videoEl.style.display = "block";
    }

    // 1. Populate and size all text fields
    document.getElementById("pill-text").textContent = CARD_CONFIG.year;
    applyAdaptiveSpeakerInfoSize(CARD_CONFIG.name, CARD_CONFIG.position_company);
    applyAdaptiveTextSize(CARD_CONFIG.title);

    // 3. Typewriter — single absolute HTML box.
    //    Text wraps naturally. Cursor stays dynamically glued to the end.
    const TOTAL_TYPING_TIME = 4.8; // Total seconds allocated for typing
    const L1_START = 1.0;

    // Cursor blinking behavior:
    // 1. Blinks before typing starts (from T=0 to T=1.0s, 2 half-cycles of 0.5s)
    tl.to("#cursor", {
      opacity: 0, duration: 0.5, repeat: 1, yoyo: true, ease: "steps(1)"
    }, 0);

    // 2. Stays solid while typing is actively moving (from T=1.0s to T=5.8s)
    tl.set("#cursor", { opacity: 1 }, L1_START);

    // 3. Blinks again when typing is finished (from T=5.8s to T=9.8s, 10 half-cycles of 0.4s = 4.0s)
    tl.to("#cursor", {
      opacity: 0, duration: 0.4, repeat: 9, yoyo: true, ease: "steps(1)"
    }, L1_START + TOTAL_TYPING_TIME);

    // 4. Hide the cursor completely at the end of the timeline so it's invisible on final frame and snapshots!
    tl.to("#cursor", {
      opacity: 0, duration: 0.01, overwrite: "auto"
    }, 9.8);

    // Dynamic typewriter tween into the HTML container
    const typeObj = { n: 0 };
    tl.to(typeObj, {
      n: CARD_CONFIG.title.length,
      duration: TOTAL_TYPING_TIME,
      ease: "none",
      onUpdate: () => {
        document.getElementById("title-text").textContent = CARD_CONFIG.title.slice(0, Math.floor(typeObj.n));
      }
    }, L1_START);

    // Register timeline under the 'main' composition ID for the studio
    window.__timelines["main"] = tl;

    // Helper API to dynamically update the card texts from browser console or MCP actions
    window.updateCard = (config) => {
      if (config.title !== undefined) CARD_CONFIG.title = config.title;
      if (config.name !== undefined) CARD_CONFIG.name = config.name;
      if (config.position_company !== undefined) CARD_CONFIG.position_company = config.position_company;
      if (config.year !== undefined) CARD_CONFIG.year = config.year;

      // Update all text fields
      document.getElementById("pill-text").textContent = CARD_CONFIG.year;
      applyAdaptiveSpeakerInfoSize(CARD_CONFIG.name, CARD_CONFIG.position_company);
      applyAdaptiveTextSize(CARD_CONFIG.title);

      // Pause timeline at the end to make sure all decorative elements are fully animated and visible
      tl.progress(1);
    };
  </script>
