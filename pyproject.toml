[project]
name = "community-studio-workspace"
version = "0.1.0"
description = "Community AI Studio multi-agent orchestration workspace"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "a2a-sdk==1.3.0",
    "asyncpg==0.32.0",
    "fastapi==0.162.2",
    "google-adk[eval]==2.14.0",
    "google-api-python-client==2.201.0",
    "google-auth==2.62.1",
    "google-auth-oauthlib==1.5.0",
    "google-cloud-aiplatform==2.7.0",
    "google-cloud-storage==3.17.1",
    "google-genai==2.34.0",
    "mcp==2.3.0",
    "openpyxl==3.1.5",
    "pillow==13.0.0",
    "pypdfium2==5.15.1",
    "python-docx==1.2.0",
    "python-dotenv==1.2.4",
    "requests==2.34.2",
    "segno==1.6.6",
    "sqlalchemy[asyncio]==2.1.8",
    "sse-starlette==3.7.0",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "ruff==0.17.4",
    "zxing-cpp==3.1.1",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agents*"]

[tool.ruff]
# Set the maximum line length to 120.
line-length = 120

[tool.ruff.lint]
# Enable pycodestyle (E, W), Pyflakes (F), and isort (I) rules.
select = ["E", "F", "I", "W"]
ignore = ["E501", "E402", "F401", "F841", "W291"]

[tool.ruff.format]
# Use double quotes for strings, standard for python.
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pyright]
extraPaths = ["agents"]
