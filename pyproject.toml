[tool.ruff]
# Set the maximum line length to 120.
line-length = 120

[tool.ruff.lint]
# Enable pycodestyle (E, W), Pyflakes (F), and isort (I) rules.
select = ["E", "F", "I", "W"]
ignore = ["E501", "E402", "F401", "F841", "W291"]

[tool.ruff.format]
# Use double quotes for strings, standard for python.
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pyright]
extraPaths = ["agents"]
